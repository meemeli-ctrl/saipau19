# Ajetaan jokaisella pushilla ja pull requestilla main-haaraan:
# asennus, lint, testit ja tuotantobuild. Punainen rasti GitHubissa = jokin
# näistä epäonnistui, eikä muutosta kannata julkaista Firebaseen.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Vite 8 ja Vitest 5 vaativat Node 22.12+ (ks. package-lock.json engines).
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm test
    - run: npm run build
